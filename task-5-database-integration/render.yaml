# Render Blueprint: creates the PostgreSQL database AND the web service, already connected.
# Render → New → Blueprint → choose this repository → set "Blueprint path" to task-5-database-integration/render.yaml
databases:
  - name: saiket-users-db
    plan: free
    databaseName: saiket_users
    user: saiket

services:
  - type: web
    name: saiket-users-api
    runtime: node
    plan: free
    rootDir: task-5-database-integration
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saiket-users-db
          property: connectionString
      # The internal Render URL is on a private network: no SSL needed.
      # (From your own computer, use the External URL with DATABASE_SSL=true.)
      - key: DATABASE_SSL
        value: "false"
      - key: SHOW_SQL
        value: "true"
