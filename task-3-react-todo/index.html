<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom — la to-do list qui fleurit</title>
    <meta name="description" content="Bloom : une to-do list en React où chaque tâche terminée fait pousser une fleur." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='18' r='12' fill='%23f472b6'/%3E%3Ccircle cx='46' cy='30' r='12' fill='%23f472b6'/%3E%3Ccircle cx='18' cy='30' r='12' fill='%23f472b6'/%3E%3Ccircle cx='24' cy='46' r='12' fill='%23f472b6'/%3E%3Ccircle cx='40' cy='46' r='12' fill='%23f472b6'/%3E%3Ccircle cx='32' cy='33' r='9' fill='%23fde68a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before React loads (no flash)
      try {
        var t = JSON.parse(localStorage.getItem("bloom-theme"));
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bloom a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
