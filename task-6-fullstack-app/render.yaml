# Render Blueprint: one web service (Express API + React build).
# Render allows only ONE free PostgreSQL database per account, so this Blueprint does not create one:
# use a free Neon database (https://neon.tech) or any PostgreSQL, and paste its URL when Render asks for DATABASE_URL.
# Render → New → Blueprint → this repository → Blueprint path: task-6-fullstack-app/render.yaml
services:
  - type: web
    name: orbit
    runtime: node
    plan: free
    rootDir: task-6-fullstack-app
    # --include=dev: Vite (a dev dependency) is needed to build the React app
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render asks for this value when you create the Blueprint
      - key: DATABASE_URL
        sync: false
      # Neon and other hosted databases require SSL
      - key: DATABASE_SSL
        value: "true"
      # Demo accounts (password Demo1234) on an empty database; set to "false" for real use
      - key: SEED_DEMO
        value: "true"
